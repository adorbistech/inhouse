server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        default_type text/plain;
        try_files /healthz =404;
    }

    # Inhouse-local API proxy (Block 13). The SPA keeps calling relative
    # /v1/...; inside the Inhouse deployment those reach the API container
    # over inhouse-net. Nothing here is host-published, and no existing
    # (host) Nginx is involved. Docker's embedded DNS is used with a
    # variable upstream so this container starts even if the API is down.
    location /v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $inhouse_api http://inhouse-api:8092;
        proxy_pass $inhouse_api;   # no URI part: request URI is forwarded unchanged

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization, x-api-key, x-inhouse-workload-id, x-request-id and
        # the request body are forwarded untouched (nginx default).

        # Streaming (SSE): never buffer either direction.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 8m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

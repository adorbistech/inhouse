services:
  inhouse-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: inhouse-frontend:local
    container_name: inhouse-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INHOUSE_FRONTEND_PORT:-8091}:80"
    networks:
      - inhouse-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  inhouse-net:
    name: inhouse-net
    driver: bridge

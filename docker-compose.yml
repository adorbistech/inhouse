services:
  inhouse-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: inhouse-frontend:local
    container_name: inhouse-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INHOUSE_FRONTEND_PORT:-8091}:80"
    networks:
      - inhouse-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  inhouse-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: inhouse-api:local
    container_name: inhouse-api
    restart: unless-stopped
    environment:
      INHOUSE_API_ENV: ${INHOUSE_API_ENV:-production}
      INHOUSE_API_HOST: 0.0.0.0
      INHOUSE_API_PORT: ${INHOUSE_API_PORT:-8092}
      INHOUSE_API_LOG_LEVEL: ${INHOUSE_API_LOG_LEVEL:-info}
      INHOUSE_API_CORS_ORIGINS: ${INHOUSE_API_CORS_ORIGINS:-}
      INHOUSE_DB_HOST: inhouse-postgres
      INHOUSE_DB_PORT: 5432
      INHOUSE_DB_NAME: ${INHOUSE_DB_NAME:-inhouse}
      INHOUSE_DB_USER: ${INHOUSE_DB_USER:-inhouse_app}
      INHOUSE_DB_PASSWORD: ${INHOUSE_DB_PASSWORD}
      INHOUSE_DB_SCHEMA: ${INHOUSE_DB_SCHEMA:-inhouse}
      INHOUSE_DB_POOL_MIN: ${INHOUSE_DB_POOL_MIN:-2}
      INHOUSE_DB_POOL_MAX: ${INHOUSE_DB_POOL_MAX:-10}
      INHOUSE_DB_SSL: ${INHOUSE_DB_SSL:-false}
      # Block 08 — no default; the container fails fast at startup without
      # it, same as INHOUSE_DB_PASSWORD. See docs/CREDENTIAL_VAULT.md.
      INHOUSE_CREDENTIAL_ENCRYPTION_KEY: ${INHOUSE_CREDENTIAL_ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:${INHOUSE_API_PORT:-8092}:${INHOUSE_API_PORT:-8092}"
    networks:
      - inhouse-net
    depends_on:
      inhouse-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('node:http').get({host:'127.0.0.1',port:process.env.INHOUSE_API_PORT||8092,path:'/health'},(res)=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Dedicated Inhouse persistence store. Not published to the host: the API
  # container reaches it over the inhouse-net Docker network by service
  # name (`inhouse-postgres`), avoiding any host port collision with
  # existing PostgreSQL instances (e.g. the host service on 5432 or the
  # unrelated adorbis-core-test-postgres container on 5433 — neither is
  # touched by, or related to, this service). See docs/DATABASE.md.
  inhouse-postgres:
    image: postgres:16-alpine
    container_name: inhouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INHOUSE_DB_NAME:-inhouse}
      POSTGRES_USER: ${INHOUSE_DB_USER:-inhouse_app}
      POSTGRES_PASSWORD: ${INHOUSE_DB_PASSWORD}
    volumes:
      - inhouse-postgres-data:/var/lib/postgresql/data
    networks:
      - inhouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INHOUSE_DB_USER:-inhouse_app} -d ${INHOUSE_DB_NAME:-inhouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  inhouse-net:
    name: inhouse-net
    driver: bridge

volumes:
  inhouse-postgres-data:
    name: inhouse-postgres-data
